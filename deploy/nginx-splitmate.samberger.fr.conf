# Copy to /etc/nginx/sites-available/splitmate.samberger.fr on the server,
# symlink into sites-enabled, then run `certbot --nginx -d splitmate.samberger.fr`
# — certbot rewrites this file to add the TLS listener and an http->https
# redirect automatically. Adjust the proxy_pass port if you changed it in
# docker-compose.yml.

server {
    listen 80;
    server_name splitmate.samberger.fr;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
